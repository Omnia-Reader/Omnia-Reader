[package]
name = "omnia-reader"
version = "0.1.0"
description = "A private, offline-first EPUB and PDF reader"
authors = ["Omnia Reader contributors"]
license = "MIT"
repository = "https://github.com/omnia-reader/omnia-reader"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "omnia_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
native-e2e = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-deep-link = "=2.4.9"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-wdio-webdriver = { version = "=1.2.0", optional = true }
uuid = { version = "1.18.1", features = ["v4"] }
