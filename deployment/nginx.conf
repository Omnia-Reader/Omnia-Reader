worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  client_body_temp_path /tmp/client-body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  map $uri $omnia_cache_control {
    default "no-cache";
    "~*^/.+[-.][a-z0-9_-]{8,}\.(?:css|js|mjs|png|svg|webp|woff2?)$" "public, max-age=31536000, immutable";
  }

  upstream sync_gateway {
    server sync-gateway:3333;
    keepalive 16;
  }

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2048m;

    include /etc/nginx/security-headers.conf;
    add_header Cache-Control $omnia_cache_control always;

    location = /healthz {
      proxy_pass http://sync_gateway/healthz;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/sync/ {
      proxy_pass http://sync_gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_request_buffering off;
      proxy_buffering off;
      proxy_connect_timeout 10s;
      proxy_read_timeout 24h;
      proxy_send_timeout 24h;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
