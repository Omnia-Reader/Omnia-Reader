name: omnia-reader

services:
  sync-gateway:
    image: omnia-reader-sync-gateway:${OMNIA_VERSION:-dev}
    build:
      context: ..
      dockerfile: deployment/Dockerfile.gateway
      args:
        OMNIA_VERSION: ${OMNIA_VERSION:-dev}
        OMNIA_REVISION: ${OMNIA_REVISION:-unknown}
    restart: unless-stopped
    init: true
    env_file:
      - path: gateway.env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
    expose:
      - '3333'
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3333/healthz').then((response) => {
          if (!response.ok) process.exit(1); }).catch(() => process.exit(1));
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6

  web:
    image: omnia-reader-web:${OMNIA_VERSION:-dev}
    build:
      context: ..
      dockerfile: deployment/Dockerfile.web
      args:
        OMNIA_VERSION: ${OMNIA_VERSION:-dev}
        OMNIA_REVISION: ${OMNIA_REVISION:-unknown}
    restart: unless-stopped
    init: true
    depends_on:
      sync-gateway:
        condition: service_healthy
    ports:
      - '${OMNIA_HTTP_PORT:-8080}:8080'
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
