name: omnia-reader-redis-test

services:
  redis:
    image: redis:7.2-bookworm@sha256:16623900b6ddd58e8bac04ccb6b611b9a5d1aed165453e28bcaed251d549d62c
    user: '999:999'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:${OMNIA_SYNC_REDIS_TEST_PORT:-46379}:6379'
    read_only: true
    tmpfs:
      - /data:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 1s
      retries: 20
      start_period: 2s
