<div class="min-h-screen bg-stone-50">
  @if (menuOpen) {
    <button
      class="fixed inset-0 z-20 border-0 bg-slate-950/45 md:hidden"
      type="button"
      aria-label="Close navigation"
      (click)="closeMenu()"
    ></button>
  }

  <aside
    id="primary-navigation"
    class="fixed inset-y-0 left-0 z-30 flex w-60 flex-col bg-white shadow-xl transition-transform md:shadow-[1px_0_10px_rgb(15_23_42/8%)]"
    [ngClass]="{
      '-translate-x-full': !menuOpen,
      'md:translate-x-0': !desktopMenuCollapsed,
      'md:-translate-x-full': desktopMenuCollapsed,
    }"
    aria-label="Primary navigation"
  >
    <a
      class="flex h-16 items-center gap-3 border-b border-stone-200 px-5 text-lg font-semibold text-slate-900 no-underline"
      routerLink="/library"
      (click)="closeMenu()"
    >
      <span
        class="material-icons text-violet-700"
        aria-hidden="true"
        translate="no"
      >
        auto_stories
      </span>
      Omnia Reader
    </a>

    <nav class="flex min-h-0 flex-1 flex-col gap-1 p-3">
      <a
        class="flex min-h-12 items-center gap-3 rounded-lg px-3 text-slate-700 no-underline hover:bg-stone-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-700"
        routerLink="/library"
        routerLinkActive="bg-violet-100 text-violet-950"
        (click)="closeMenu()"
      >
        <span class="material-icons" aria-hidden="true" translate="no">
          library_books
        </span>
        <span>Library</span>
      </a>
      <a
        class="mt-auto flex min-h-12 items-center gap-3 rounded-lg px-3 text-slate-700 no-underline hover:bg-stone-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-700"
        routerLink="/settings"
        routerLinkActive="bg-violet-100 text-violet-950"
        (click)="closeMenu()"
      >
        <span class="material-icons" aria-hidden="true" translate="no">
          settings
        </span>
        <span>Settings</span>
      </a>
    </nav>
  </aside>

  <div
    class="min-h-screen"
    [ngClass]="desktopMenuCollapsed ? 'md:pl-0' : 'md:pl-60'"
  >
    <header
      data-testid="app-toolbar"
      class="sticky top-0 z-10 flex h-16 items-center bg-violet-700 px-3 text-white shadow-sm"
    >
      <button
        class="grid size-12 cursor-pointer place-content-center rounded-full border-0 bg-transparent text-white hover:bg-white/10 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
        type="button"
        aria-label="Toggle app navigation"
        aria-controls="primary-navigation"
        [attr.aria-expanded]="mainSidenavExpanded"
        (click)="toggleMainSidenav()"
      >
        <span class="material-icons" aria-hidden="true" translate="no">
          menu
        </span>
      </button>
      <span class="ml-2 font-medium md:sr-only">Omnia Reader</span>
      <a
        data-testid="global-sync-status"
        class="relative ml-auto grid size-11 shrink-0 place-items-center rounded-full text-sm font-medium no-underline transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
        [ngClass]="syncStatusClasses"
        [routerLink]="syncSettingsRoute"
        [attr.aria-label]="syncStatusAriaLabel"
        [attr.title]="syncStatusTitle"
      >
        @switch (syncProvider) {
          @case ('git') {
            <svg
              data-provider-icon="git"
              class="size-6"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M12 .297C5.37.297 0 5.67 0 12.297c0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.043-1.61-4.043-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.083-.73.083-.73 1.205.084 1.838 1.237 1.838 1.237 1.07 1.835 2.809 1.305 3.495.998.108-.776.418-1.305.762-1.605-2.665-.305-5.467-1.334-5.467-5.93 0-1.31.467-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23a11.51 11.51 0 0 1 3-.404c1.02.005 2.045.138 3 .404 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.922.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
              />
            </svg>
          }
          @case ('mega') {
            <svg
              data-provider-icon="mega"
              class="size-6"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M7 17V7l5 5 5-5v10" stroke-linejoin="round" />
            </svg>
          }
          @default {
            <span
              class="material-icons text-xl"
              aria-hidden="true"
              translate="no"
              >{{ syncStatusIcon }}</span
            >
          }
        }
        @if (syncProvider) {
          <span
            class="absolute -right-0.5 -bottom-0.5 grid size-5 place-items-center rounded-full ring-2 ring-violet-700"
            [ngClass]="syncStatusClasses"
            aria-hidden="true"
          >
            <span
              class="material-icons !text-sm motion-reduce:animate-none"
              [class.animate-spin]="syncStatusBusy"
              translate="no"
              >{{ syncStatusIcon }}</span
            >
          </span>
        }
        <span class="sr-only">{{ syncStatusLabel }}</span>
      </a>
      <span class="sr-only" aria-live="polite">{{ syncStatusAriaLabel }}</span>
    </header>
    <router-outlet></router-outlet>
  </div>
</div>
