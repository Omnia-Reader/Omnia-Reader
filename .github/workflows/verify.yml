name: Verify

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web, gateway, and release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run project tests
        run: npx nx run-many -t test --all --skip-nx-cache

      - name: Run project lint
        run: npx nx run-many -t lint --all --skip-nx-cache

      - name: Build the production web application
        run: npx nx build omnia-reader --configuration production --skip-nx-cache

      - name: Build the production synchronization gateway
        run: npx nx build sync-gateway --configuration production --skip-nx-cache

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Test release verification
        run: npm run release:test

      - name: Verify release metadata and manifests
        run: npm run release:verify -- --skip-build

  browser:
    name: Browser compatibility (${{ matrix.browser }}, shard ${{ matrix.shard }})
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - webkit
        shard:
          - 1/2
          - 2/2
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install the Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build the production web application
        run: npx nx build omnia-reader --configuration production --skip-nx-cache

      - name: Run active browser journeys
        run: >-
          PLAYWRIGHT_HTML_OPEN=never
          npx playwright test
          --config apps/omnia-reader-e2e/playwright.config.ts
          --project=${{ matrix.browser }}
          --workers=1
          --shard=${{ matrix.shard }}

  browser-specialized:
    name: Browser PWA and performance budgets
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the production web application
        run: npx nx build omnia-reader --configuration production --skip-nx-cache

      - name: Run installed-PWA offline journey
        run: >-
          PLAYWRIGHT_HTML_OPEN=never PWA_E2E=1
          npx playwright test
          --config apps/omnia-reader-e2e/playwright.config.ts
          --project=chromium
          --workers=1
          offline.spec.ts

      - name: Enforce large-publication performance and memory budgets
        run: >-
          PLAYWRIGHT_HTML_OPEN=never PERFORMANCE_E2E=1
          npx playwright test
          --config apps/omnia-reader-e2e/playwright.config.ts
          --project=chromium
          --workers=1
          performance.spec.ts

  desktop:
    name: Desktop bundle (${{ matrix.platform }})
    needs: web
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: windows-x64
            runner: windows-2025
          - platform: macos-arm64
            runner: macos-15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            dbus-x11 \
            xvfb

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal

      - name: Install locked dependencies
        run: npm ci

      - name: Build unsigned desktop bundles
        run: npm run native:build

      - name: Run native desktop lifecycle journey
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a npm run native:e2e

      - name: Upload unsigned verification bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omnia-reader-${{ matrix.platform }}-unsigned
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android aarch64 debug packages
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install the pinned Rust toolchain and Android target
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup target add aarch64-linux-android --toolchain 1.89.0

      - name: Install Android SDK and NDK components
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: npm ci

      - name: Build debug APK and AAB
        run: npm run android:build -- --debug --apk --aab --target aarch64 --ci

      - name: Upload unsigned Android packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omnia-reader-android-aarch64-debug-unsigned
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/universalDebug/*.aab
          if-no-files-found: error
          retention-days: 7
